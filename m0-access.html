<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#103D33">
<title>M0 moduli — kirish · Kompas Lab</title>
<link rel="icon" href="img/brand/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Caladea:wght@700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=Playfair+Display:wght@400;700&text=%CA%BB%CA%BC&display=swap" rel="stylesheet"><script src="js/alifbo.js"></script>
<link rel="stylesheet" href="css/brand.css">
<style>
:root{color-scheme:light;--g:#2d4a3e;--gd:#103D33;--t:#c4622d;--cream:#f4f3ef;--line:#e0e8e4;--muted:#5d7068}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 16px;
 background:radial-gradient(900px 420px at 50% -10%,#e3efe9 0,transparent 70%),var(--cream);color:var(--gd);font-family:'Outfit','IBM Plex Sans',system-ui,sans-serif}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--gd);font-weight:800;font-size:19px;letter-spacing:.2px}
.brand .klogo{width:44px;height:44px;border-radius:12px}
main{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:34px 28px 28px;box-shadow:0 18px 50px rgba(16,61,51,.10);text-align:center}
.tag{display:inline-block;font-family:'JetBrains Mono','IBM Plex Sans',monospace;font-size:12px;font-weight:600;letter-spacing:.4px;color:var(--t);background:#fbeee6;border-radius:99px;padding:5px 12px;margin-bottom:14px}
h1{font-family:Cambria,'Caladea','Playfair Display',serif;font-size:28px;line-height:1.2;margin:0 0 10px;color:var(--g)}
p{line-height:1.6;color:var(--muted);margin:0 0 20px;font-size:16px}
.actions{display:grid;gap:10px}
.btn{display:block;text-decoration:none;border:0;cursor:pointer;font:inherit;border-radius:14px;font-weight:700;font-size:16.5px;padding:13px 16px;min-height:50px;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px)}
.primary{background:var(--t);color:#fff;box-shadow:0 6px 16px rgba(196,98,45,.28)}
.secondary{background:#e8f0ec;color:var(--g)}
#note{display:none;text-align:left;font-size:14.5px;line-height:1.5;color:#7a3e17;background:#fbeee6;border:1px solid #f1d3c1;border-radius:12px;padding:10px 12px;margin:0 0 16px}
#status{font-size:14px;margin:16px 0 0;min-height:20px;color:var(--muted)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--t);border-radius:50%;vertical-align:-2px;margin-right:8px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.back{font-size:14px;color:var(--muted);text-decoration:none}.back:hover{color:var(--g)}
a:focus-visible,button:focus-visible{outline:3px solid #2a8066;outline-offset:3px}
@media(prefers-reduced-motion:reduce){.spin{animation:none}.btn{transition:none}}
</style>
</head>
<body>
<a class="brand" href="index.html" aria-label="Kompas Lab, bosh sahifa"><span class="klogo"><img class="klogo-b" src="img/brand/logo-base.webp" alt="" width="128" height="128"><img class="klogo-a" src="img/brand/logo-arrow.webp" alt="" width="128" height="128"></span>Kompas Lab</a>
<main>
<span class="tag">M0 · BEPUL MODUL</span>
<h1>Bepul oʻquv moduli</h1>
<p>Barcha Lablarning M0 darslari bepul. Darslarni oʻqish va natijalaringizni saqlash uchun Kompas Lab hisobingiz kerak.</p>
<div id="note" role="alert"></div>
<div class="actions">
<a id="register" class="btn primary" href="register.html">Bepul roʻyxatdan oʻtish</a>
<a id="login" class="btn secondary" href="login.html">Hisobga kirish</a>
<button id="retry" class="btn secondary" type="button" hidden>Qayta urinish</button>
</div>
<p id="status" role="status" aria-live="polite"><span class="spin" aria-hidden="true"></span>Kirish holati tekshirilmoqda…</p>
</main>
<a class="back" href="index.html">← Bosh sahifaga qaytish</a>
<script src="js/utm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script>
(function(){
  const raw = new URLSearchParams(location.search).get("next") || "/dashboard.html";
  // Prevent open redirects, traversal and loops.
  const allowed = /^\/(?:maktab-lab|bachelor-lab|master-lab|phd-lab|gks-lab|erasmus-lab|erasmus-plus-lab|usa-lab|daad-lab|mext-lab|tadbirkor-talaba|tt-lab|musofir-lab|ai-amaliyot-lab|research-lab)-m0(?:-[1-9]\d*|-yakun)?(?:\.html)?(?:\?.*)?$/i;
  const next = allowed.test(raw) ? raw : "/dashboard.html";
  const status = document.getElementById("status"), note = document.getElementById("note"), retry = document.getElementById("retry");
  const reg = document.getElementById("register"), log = document.getElementById("login");
  function say(t, busy){ status.innerHTML = (busy ? '<span class="spin" aria-hidden="true"></span>' : "") + t; }
  function showNote(t){ note.textContent = t; note.style.display = "block"; }
  document.querySelectorAll(".actions a").forEach(function(a) {
    a.addEventListener("click", function(){
      try {
        sessionStorage.setItem("returnTo", next);
        localStorage.setItem("kompas_return", JSON.stringify({to:next,at:Date.now()}));
      } catch (_) {}
    });
  });
  function signedOut(msg){ retry.hidden = true; reg.hidden = false; log.hidden = false; say(msg || "Davom etish uchun roʻyxatdan oʻting yoki kiring.", false); }
  // Hisob oʻchirilgan yoki sessiya yaroqsiz: mahalliy sessiya, kesh va M0 cookie tozalanadi
  async function clearStale(){
    try { await window.supabase.auth.signOut({scope:"local"}); } catch (_) {}
    try { localStorage.removeItem("kompas_me_v1"); sessionStorage.removeItem("kompas_vfy_v1"); } catch (_) {}
    try { await fetch("/api/m0-session",{method:"DELETE",credentials:"same-origin"}); } catch (_) {}
  }
  async function go(){
    retry.hidden = true; say("Kirish holati tekshirilmoqda…", true);
    if (!window.supabase?.auth) { say("Ulanish mavjud emas. Sahifani yangilang.", false); retry.hidden = false; return; }
    let session;
    try { session = (await window.supabase.auth.getSession())?.data?.session; } catch (_) { session = null; }
    if (!session?.access_token) { signedOut(); return; }
    say("Hisob tekshirilmoqda…", true);
    let who;
    try { who = await window.supabase.auth.getUser(session.access_token); }
    catch (_) { say("Tarmoq bilan aloqa yoʻq. Ulanishni tekshirib, qayta urinib koʻring.", false); reg.hidden = log.hidden = true; retry.hidden = false; return; }
    if (who?.error || !who?.data?.user) {
      const st = who?.error?.status;
      if (st === 401 || st === 403 || st === 404 || !st) {
        await clearStale();
        showNote("Bu hisob topilmadi yoki sessiya tugagan. Qayta kiring yoki yangi hisob oching.");
        signedOut("Davom etish uchun roʻyxatdan oʻting yoki kiring."); return;
      }
      say("Xizmat vaqtincha javob bermayapti. Birozdan soʻng qayta urinib koʻring.", false); reg.hidden = log.hidden = true; retry.hidden = false; return;
    }
    say("Hisob tasdiqlandi. Modul ochilmoqda…", true);
    try {
      const res = await fetch("/api/m0-session",{
        method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({access_token:session.access_token})
      });
      if (res.status === 401) { await clearStale(); showNote("Sessiya yaroqsiz boʻlib qoldi. Qayta kiring."); signedOut(); return; }
      if (!res.ok) throw new Error("session_exchange_failed");
      location.replace(next);
    } catch (_) {
      say("Modulni ochib boʻlmadi. Birozdan soʻng qayta urinib koʻring.", false); reg.hidden = log.hidden = true; retry.hidden = false;
    }
  }
  retry.addEventListener("click", go);
  go();
})();
</script>
</body>
</html>
