<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2d4a3e">
<title>Yoʻnalishlar globusi · prototip · Kompas Lab</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Noto+Serif+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=Playfair+Display:wght@400;700&text=%CA%BB%CA%BC%C3%96%C3%B6%C4%9E%C4%9F%C5%9E%C5%9F%C3%87%C3%A7&display=swap" rel="stylesheet"><script src="js/alifbo.js"></script>
<style>
:root{--accent:#2d4a3e;--accent2:#c4622d;--bg:#f4f3ef;--surface:#fffefb;--border:#e2ded3;--text:#1a2e26;--muted:#5f7169;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Outfit","IBM Plex Sans",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px;}
section{padding:48px 0;}
h2{font-family:"Noto Serif Display","Playfair Display",serif;font-weight:400;font-size:clamp(28px,4vw,40px);color:var(--accent);line-height:1.15;margin-bottom:10px;}
.sub{color:var(--muted);max-width:640px;margin-bottom:24px;}
.proto{font-size:13px;font-weight:800;background:#f8f0d6;color:#8a6a10;border-radius:99px;padding:4px 12px;display:inline-block;margin-bottom:14px;}

</style>
<link rel="stylesheet" href="css/globe.css">
</head>
<body>
<section>
  <div class="wrap">
    <span class="proto">Prototip · saytga ulanmagan</span>
    <h2>Toshkentdan qayerga?</h2>
    <p class="sub">Mamlakatni tanlang yoki globusdagi nuqtani bosing: u yerga qaysi Lab tayyorlashini koʻrasiz. Globusni barmoq yoki sichqoncha bilan aylantiring, + va − bilan yaqinlashtiring.</p>
    <div class="kglobe" data-globe></div>
  </div>
</section>
<script src="js/sfx.js" defer></script>
<script src="js/globe.js" defer></script>
</body>
</html>
