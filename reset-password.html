<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parolni tiklash — Kompas Lab</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=Playfair+Display:wght@400;700&text=%CA%BB%CA%BC&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#2d4a3e;--accent-hover:#1e3329;--accent-light:#e8f0ec;
  --accent2:#c4622d;--bg:#f5f7f6;--surface:#ffffff;
  --border:#e0e8e4;--text:#1a2e26;--muted:#6b7f76;
  --green:#1a7a4a;--green-light:#e6f4ec;
  --red:#c0392b;--red-light:#fdecea;
  --gold:#b08a00;--gold-light:#fdf6dc;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Outfit','IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}

/* NAV */
.nav{background:white;border-bottom:1px solid var(--border);padding:0 5%;height:60px;display:flex;align-items:center;justify-content:space-between;}
.nav-logo{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:800;color:var(--accent);text-decoration:none;}
.nav-logo-mark{width:32px;height:32px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.nav-back{font-size:13px;color:var(--muted);text-decoration:none;font-weight:600;transition:color 0.2s;}
.nav-back:hover{color:var(--accent);}

/* LAYOUT */
.page{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 60px);}

/* LEFT PANEL */
.left-panel{background:var(--accent);padding:60px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;}
.left-panel::before{content:'';position:absolute;width:400px;height:400px;background:radial-gradient(circle,rgba(255,255,255,0.05) 0%,transparent 70%);top:-100px;right:-100px;}
.left-panel::after{content:'';position:absolute;width:300px;height:300px;background:radial-gradient(circle,rgba(196,98,45,0.15) 0%,transparent 70%);bottom:-50px;left:-50px;}
.lp-content{position:relative;z-index:1;}
.lp-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.9);padding:6px 14px;border-radius:99px;font-size:12px;font-weight:700;font-family:'JetBrains Mono','IBM Plex Sans',monospace;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:24px;}
.lp-title{font-size:38px;font-weight:900;color:white;line-height:1.1;letter-spacing:-1.5px;margin-bottom:16px;}
.lp-title span{color:rgba(196,98,45,0.9);}
.lp-sub{font-size:15px;color:rgba(255,255,255,0.7);line-height:1.7;margin-bottom:36px;}
.lp-features{display:flex;flex-direction:column;gap:14px;}
.lp-feat{display:flex;align-items:flex-start;gap:12px;}
.lp-feat-icon{width:36px;height:36px;background:rgba(255,255,255,0.1);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.lp-feat-text{flex:1;}
.lp-feat-title{font-size:13px;font-weight:700;color:white;margin-bottom:2px;}
.lp-feat-desc{font-size:12px;color:rgba(255,255,255,0.6);}
.lp-divider{height:1px;background:rgba(255,255,255,0.1);margin:28px 0;}
.lp-mentor{display:flex;align-items:center;gap:12px;}
.lp-mentor-avatar{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.15);border:2px solid rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;font-size:20px;}
.lp-mentor-name{font-size:13px;font-weight:700;color:white;}
.lp-mentor-title{font-size:11px;color:rgba(255,255,255,0.6);}

/* RIGHT PANEL */
.right-panel{background:white;padding:60px;display:flex;flex-direction:column;justify-content:center;}
.form-wrap{max-width:400px;width:100%;}
.form-title{font-size:26px;font-weight:900;letter-spacing:-0.5px;margin-bottom:6px;}
.form-sub{font-size:14px;color:var(--muted);margin-bottom:32px;}
.form-sub a{color:var(--accent);font-weight:600;text-decoration:none;}
.form-sub a:hover{text-decoration:underline;}

/* FORM ELEMENTS */
.field{margin-bottom:18px;}
.field-label{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;color:var(--text);margin-bottom:6px;}
.field-label a{font-size:12px;color:var(--accent);text-decoration:none;font-weight:600;}
.field-label a:hover{text-decoration:underline;}
.field-input-wrap{position:relative;}
.field-input{
  width:100%;padding:12px 16px;
  border:2px solid var(--border);border-radius:10px;
  font-size:14px;font-family:'Outfit','IBM Plex Sans',sans-serif;
  color:var(--text);background:var(--bg);
  transition:all 0.2s;outline:none;
}
.field-input:focus{border-color:var(--accent);background:white;box-shadow:0 0 0 3px rgba(45,74,62,0.08);}
.field-input.error{border-color:var(--red);background:var(--red-light);}
.field-input::placeholder{color:var(--muted);}
.field-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none;}
.field-eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;color:var(--muted);padding:4px;}
.field-error{font-size:12px;color:var(--red);margin-top:6px;display:none;align-items:center;gap:4px;}
.field-error.show{display:flex;}

/* CHECKBOX */
.checkbox-wrap{display:flex;align-items:center;gap:10px;margin-bottom:24px;}
.checkbox-wrap input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;}
.checkbox-wrap label{font-size:13px;color:var(--muted);}

/* BTN */
.btn-submit{
  width:100%;padding:14px;
  background:var(--accent);color:white;
  border:none;border-radius:10px;
  font-size:15px;font-weight:700;
  font-family:'Outfit','IBM Plex Sans',sans-serif;
  cursor:pointer;transition:all 0.2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-submit:hover{background:var(--accent-hover);transform:translateY(-1px);box-shadow:0 4px 16px rgba(45,74,62,0.25);}
.btn-submit:disabled{opacity:0.6;cursor:not-allowed;transform:none;}

/* DIVIDER */
.or-divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--muted);font-size:13px;}
.or-divider::before,.or-divider::after{content:'';flex:1;height:1px;background:var(--border);}

/* ALERT */
.alert{padding:12px 16px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:16px;display:none;align-items:center;gap:8px;}
.alert.show{display:flex;}
.alert.error{background:var(--red-light);color:var(--red);border:1px solid #f5c6c3;}
.alert.success{background:var(--green-light);color:var(--green);border:1px solid #b8e4cc;}

/* LOADING SPINNER */
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.7s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg);}}

/* RESPONSIVE */
@media(max-width:800px){
  .page{grid-template-columns:1fr;}
  .left-panel{display:none;}
  .right-panel{padding:40px 24px;}
}
</style>

<body>
<nav class="nav">
  <a href="index.html" class="nav-logo">
    <span class="klogo"><img class="klogo-b" src="img/brand/logo-base.webp" alt="" width="128" height="128"><img class="klogo-a" src="img/brand/logo-arrow.webp" alt="" width="128" height="128"></span>
    Kompas Lab
  </a>
  <a href="index.html" class="nav-back">← Bosh sahifaga</a>
</nav>
<div class="page" style="grid-template-columns:1fr">
  <div class="right-panel">
    <div class="form-wrap">
      <h1 class="form-title" id="ttl">Parolni tiklash</h1>
      <p class="form-sub" id="sub">Hisobingiz emailini kiriting: parolni yangilash havolasini yuboramiz.</p>
      <div class="alert error" id="errorAlert">⚠️ <span id="errorMsg"></span></div>
      <div class="alert success" id="okAlert">✓ <span id="okMsg"></span></div>

      <form id="reqForm" novalidate>
        <div class="field">
          <label class="field-label" for="emailInput">Email manzil</label>
          <div class="field-input-wrap"><input type="email" id="emailInput" class="field-input" placeholder="example@gmail.com" autocomplete="email" required></div>
        </div>
        <button type="submit" class="btn-submit" id="reqBtn"><span>Havolani yuborish</span><span>→</span></button>
      </form>

      <form id="newForm" novalidate hidden>
        <div class="field">
          <label class="field-label" for="pw1">Yangi parol</label>
          <div class="field-input-wrap"><input type="password" id="pw1" class="field-input" placeholder="Kamida 8 ta belgi, 1 raqam" autocomplete="new-password" required></div>
        </div>
        <div class="field">
          <label class="field-label" for="pw2">Parolni tasdiqlang</label>
          <div class="field-input-wrap"><input type="password" id="pw2" class="field-input" autocomplete="new-password" required></div>
        </div>
        <button type="submit" class="btn-submit" id="newBtn"><span>Parolni saqlash</span><span>→</span></button>
      </form>

      <div style="text-align:center;font-size:13px;color:var(--muted);margin-top:18px">
        <a href="login.html" style="color:var(--accent);font-weight:700;text-decoration:none">← Kirish sahifasiga</a>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script>
// Parolni tiklash: 1) email → havola; 2) havola orqali qaytganda yangi parol (PASSWORD_RECOVERY)
(function () {
  var sb = window.supabase, $ = function (id) { return document.getElementById(id); };
  function err(t) { $("okAlert").classList.remove("show"); $("errorMsg").textContent = t; $("errorAlert").classList.add("show"); }
  function ok(t) { $("errorAlert").classList.remove("show"); $("okMsg").textContent = t; $("okAlert").classList.add("show"); }
  function busy(b, on, txt) { b.disabled = on; b.firstElementChild.textContent = txt; }
  function recoveryMode() {
    $("reqForm").hidden = true; $("newForm").hidden = false;
    $("ttl").textContent = "Yangi parol"; $("sub").textContent = "Yangi parolni kiriting va saqlang.";
  }
  if (/type=recovery/.test(location.hash)) recoveryMode();
  if (sb && sb.auth) sb.auth.onAuthStateChange(function (ev) { if (ev === "PASSWORD_RECOVERY") recoveryMode(); });

  $("reqForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var email = $("emailInput").value.trim().toLowerCase(), b = $("reqBtn");
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err("Email notoʻgʻri formatda."); return; }
    if (!sb || !sb.auth) { err("Ulanib boʻlmadi. Sahifani yangilang."); return; }
    busy(b, true, "Yuborilmoqda...");
    sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + "/reset-password.html" }).then(function (r) {
      busy(b, false, "Havolani yuborish");
      // Email bazada bormi-yoʻqmi oshkor qilinmaydi
      if (r.error && /rate|seconds/i.test(r.error.message)) { err("Juda koʻp urinish. Bir necha daqiqadan keyin qayta urinib koʻring."); return; }
      ok("Agar bu email bilan hisob boʻlsa, parolni yangilash havolasi yuborildi. Spam papkasini ham tekshiring.");
    }).catch(function () { busy(b, false, "Havolani yuborish"); err("Xatolik. Internetni tekshirib, qayta urinib koʻring."); });
  });

  $("newForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var p1 = $("pw1").value, p2 = $("pw2").value, b = $("newBtn");
    if (p1.length < 8 || !/[0-9]/.test(p1)) { err("Parol kamida 8 ta belgi va 1 raqamdan iborat boʻlsin."); return; }
    if (p1 !== p2) { err("Parollar mos kelmadi."); return; }
    busy(b, true, "Saqlanmoqda...");
    sb.auth.updateUser({ password: p1 }).then(function (r) {
      busy(b, false, "Parolni saqlash");
      if (r.error) { err(/session|expired|invalid/i.test(r.error.message) ? "Havola eskirgan. Yangi havola soʻrang." : "Saqlab boʻlmadi: " + r.error.message); return; }
      ok("Parol yangilandi. Kabinetga yoʻnaltirilmoqda...");
      setTimeout(function () { location.href = "dashboard.html"; }, 1200);
    });
  });
})();
</script>
</body>
