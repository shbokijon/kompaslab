name: Admin UI regression
on:
  pull_request:
    paths:
      - admin.html
      - 'js/admin-extensions.js'
      - 'js/auth.js'
      - 'js/paid-module.js'
      - 'js/kompas-module.js'
      - 'css/admin-extensions.css'
      - 'tools/admin/**'
      - '.github/workflows/admin-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admin-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned browser runner
        run: |
          npm install --no-save --ignore-scripts playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Serve checked-out site locally
        run: |
          nohup python3 -m http.server 8814 --bind 127.0.0.1 > /tmp/kl-admin-http.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:8814/admin.html > /dev/null
      - name: Test existing design on desktop and mobile
        env:
          BASE: http://127.0.0.1:8814
        run: node tools/admin/test-admin.cjs
